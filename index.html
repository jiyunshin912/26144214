<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>감성 캐리어 짐싸기 앱</title>
    <style>
        /* [1] 폰트 및 전체 페이지 스타일 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4f1ea; /* 따뜻한 캔버스 배경색 */
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* [2] 메인 앱 컨테이너 (그림자 효과로 앱처럼 보이게) */
        .app-container {
            background: white;
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            box-sizing: border-box;
        }

        /* [3] 상단 헤더 및 디데이(D-Day) 영역 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #ddd;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #2c3e50;
        }

        .d-day-box {
            background: #fff3cd;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .d-day-box input {
            border: none;
            background: transparent;
            font-family: inherit;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        #d-day-display {
            font-size: 1.2rem;
            color: #ff4757;
        }

        /* [4] 콘텐츠 레이아웃 (왼쪽 캐리어, 오른쪽 리스트) */
        .main-content {
            display: flex;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column; /* 모바일에서는 세로로 배치 */
            }
        }

        /* --- 왼쪽: 캐리어 (드롭 존) 영역 --- */
        .suitcase-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .suitcase-handle {
            width: 100px;
            height: 20px;
            border: 8px solid #a4b0be;
            border-bottom: none;
            border-radius: 15px 15px 0 0;
        }

        .suitcase-body {
            width: 100%;
            min-height: 350px;
            background-color: #747d8c;
            border-radius: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 10px 15px rgba(0,0,0,0.1);
            padding: 20px;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 15px;
            transition: all 0.3s ease; /* 애니메이션 효과 */
        }

        .suitcase-body.drag-over {
            background-color: #57606f; /* 물건이 올라가면 색이 진해짐 */
            transform: scale(1.02);
        }

        .placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #dfe4ea;
            font-weight: 700;
            pointer-events: none;
            opacity: 0.7;
        }

        /* --- 오른쪽: 아이템 및 체크리스트 영역 --- */
        .items-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 진행률 바 (Progress Bar) */
        .progress-container {
            background: #f1f2f6;
            border-radius: 15px;
            padding: 15px;
        }
        
        .progress-title {
            margin: 0 0 10px 0;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 15px;
            background-color: #dfe4ea;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1e90ff, #70a1ff);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 드래그할 물건들 (스티커 느낌) */
        .draggable-items {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            min-height: 80px;
            padding: 15px;
            background: #f8f9fa;
            border: 2px dashed #ced4da;
            border-radius: 15px;
        }

        .item {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: grab;
            user-select: none;
            transition: transform 0.2s;
        }

        .item:hover {
            transform: translateY(-5px); /* 마우스 올리면 살짝 뜸 */
        }

        .item.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        /* 체크리스트 텍스트 */
        .checklist {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .checklist li {
            padding: 8px 12px;
            background: #f1f2f6;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #57606f;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 짐을 쌌을 때 (완료선 긋기) */
        .checklist li.packed {
            text-decoration: line-through;
            color: #a4b0be;
            background: #eccc68; /* 완료되면 귀여운 노란색으로 변함 */
        }

        /* 초기화 버튼 */
        #reset-btn {
            background-color: #2f3542;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: auto;
        }

        #reset-btn:hover {
            background-color: #57606f;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 상단 헤더 및 디데이 -->
        <header>
            <h1>✈️ 짐싸기 캔버스</h1>
            <div class="d-day-box">
                <!-- 날짜를 선택하면 자바스크립트가 자동으로 D-day를 계산함 -->
                <input type="date" id="trip-date" value="2024-12-25">
                <span id="d-day-display">D-Day</span>
            </div>
        </header>

        <div class="main-content">
            <!-- 왼쪽: 캐리어 영역 (물건을 드롭할 곳) -->
            <div class="suitcase-section">
                <div class="suitcase-handle"></div>
                <div class="suitcase-body" id="suitcase-zone">
                    <span class="placeholder-text" id="placeholder">이곳으로 짐을 드래그하세요!</span>
                </div>
            </div>

            <!-- 오른쪽: 컨트롤 영역 -->
            <div class="items-section">
                
                <!-- 1. 진행률 바 -->
                <div class="progress-container">
                    <p class="progress-title">짐싸기 달성률: <span id="progress-text">0%</span></p>
                    <div class="progress-bar-bg">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
                
                <!-- 2. 드래그할 아이템들 (바깥 영역) -->
                <div class="draggable-items" id="outside-zone">
                    <div class="item" draggable="true" id="item-passport" title="여권">🛂</div>
                    <div class="item" draggable="true" id="item-ticket" title="항공권">🎫</div>
                    <div class="item" draggable="true" id="item-card" title="카드/현금">💳</div>
                    <div class="item" draggable="true" id="item-clothes" title="옷">👕</div>
                    <div class="item" draggable="true" id="item-skincare" title="스킨케어">🧴</div>
                    <div class="item" draggable="true" id="item-camera" title="카메라">📸</div>
                    <div class="item" draggable="true" id="item-sunglasses" title="선글라스">🕶️</div>
                    <div class="item" draggable="true" id="item-charger" title="충전기">🔋</div>
                </div>

                <!-- 3. 체크리스트 텍스트 -->
                <ul class="checklist">
                    <li id="check-passport">여권</li>
                    <li id="check-ticket">항공권</li>
                    <li id="check-card">카드/현금</li>
                    <li id="check-clothes">여벌 옷</li>
                    <li id="check-skincare">스킨케어 파우치</li>
                    <li id="check-camera">카메라</li>
                    <li id="check-sunglasses">선글라스</li>
                    <li id="check-charger">충전기 및 보조배터리</li>
                </ul>

                <button id="reset-btn">짐 몽땅 다시 싸기 🔄</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================
           1. 디데이(D-Day) 자동 계산 기능
           ========================================= */
        const dateInput = document.getElementById('trip-date');
        const dDayDisplay = document.getElementById('d-day-display');

        function updateDDay() {
            const today = new Date();
            today.setHours(0, 0, 0, 0); // 오늘 날짜의 시간을 자정으로 초기화 (날짜만 비교하기 위함)
            
            const targetDate = new Date(dateInput.value);
            targetDate.setHours(0, 0, 0, 0);

            // 두 날짜의 차이를 구해서 '일(day)' 단위로 변환
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) {
                dDayDisplay.textContent = `D-${diffDays}`;
                dDayDisplay.style.color = '#ff4757'; // 남았을 땐 빨간색
            } else if (diffDays === 0) {
                dDayDisplay.textContent = `D-Day! 🎉`;
                dDayDisplay.style.color = '#2ed573'; // 당일엔 초록색
            } else {
                dDayDisplay.textContent = `D+${Math.abs(diffDays)}`;
                dDayDisplay.style.color = '#57606f'; // 지났으면 회색
            }
        }
        
        // 날짜를 변경할 때마다 계산 함수 실행
        dateInput.addEventListener('change', updateDDay);
        updateDDay(); // 처음 페이지 로드 시에도 1회 실행


        /* =========================================
           2. 드래그 앤 드롭 (Drag & Drop) 기능 
           ========================================= */
        const items = document.querySelectorAll('.item');
        const suitcaseZone = document.getElementById('suitcase-zone');
        const outsideZone = document.getElementById('outside-zone');
        const totalItemsCount = items.length;

        // 각각의 아이템에 드래그 시작/종료 이벤트 달기
        items.forEach(item => {
            item.addEventListener('dragstart', (e) => {
                item.classList.add('dragging');
                // 드래그 중인 아이템의 ID를 데이터로 저장 (드롭할 때 꺼내 쓰기 위함)
                e.dataTransfer.setData('text/plain', item.id);
            });

            item.addEventListener('dragend', () => {
                item.classList.remove('dragging');
            });
        });

        // 짐을 넣을 '캐리어' 영역에 대한 이벤트
        suitcaseZone.addEventListener('dragover', (e) => {
            e.preventDefault(); // 기본 이벤트를 막아야 drop 이벤트가 발생함
            suitcaseZone.classList.add('drag-over'); // 마우스 올라갔을 때 시각적 효과
        });

        suitcaseZone.addEventListener('dragleave', () => {
            suitcaseZone.classList.remove('drag-over');
        });

        // 캐리어에 짐을 떨어뜨렸을 때(Drop)
        suitcaseZone.addEventListener('drop', (e) => {
            e.preventDefault();
            suitcaseZone.classList.remove('drag-over');
            
            // 드래그 시작할 때 저장했던 아이템 ID 가져오기
            const id = e.dataTransfer.getData('text/plain');
            const draggedElement = document.getElementById(id);
            
            if (draggedElement) {
                // 아이템을 캐리어 안으로 이동시킴 (HTML 구조상 자식 요소로 추가)
                suitcaseZone.appendChild(draggedElement);
                updateAppStatus(); // 진행률 및 체크리스트 업데이트
            }
        });

        // 캐리어에서 다시 '바깥'으로 물건을 뺄 때
        outsideZone.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        outsideZone.addEventListener('drop', (e) => {
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            const draggedElement = document.getElementById(id);
            
            if (draggedElement) {
                outsideZone.appendChild(draggedElement);
                updateAppStatus();
            }
        });


        /* =========================================
           3. 진행률 및 체크리스트 업데이트 로직
           ========================================= */
        function updateAppStatus() {
            // 캐리어 안에 들어있는 짐의 개수 파악
            // 주의: placeholder 텍스트도 자식 요소이므로 '.item' 클래스만 센다.
            const packedItemsCount = suitcaseZone.querySelectorAll('.item').length;
            
            // 퍼센트(%) 계산 (현재 들어간 짐 / 전체 짐 * 100)
            const percent = Math.round((packedItemsCount / totalItemsCount) * 100);

            // 게이지 바 애니메이션 업데이트
            document.getElementById('progress-fill').style.width = percent + '%';
            document.getElementById('progress-text').textContent = percent + '%';

            // 캐리어가 비어있으면 안내 문구 보이기, 짐이 있으면 숨기기
            const placeholder = document.getElementById('placeholder');
            if (packedItemsCount > 0) {
                placeholder.style.display = 'none';
            } else {
                placeholder.style.display = 'block';
            }

            // 체크리스트(li 요소)에 줄 긋기
            items.forEach(item => {
                // 아이템 아이디(item-passport)를 체크리스트 아이디(check-passport)로 변환
                const checklistId = item.id.replace('item-', 'check-');
                const checklistElement = document.getElementById(checklistId);
                
                // 해당 아이템의 부모가 '캐리어'라면 완료(.packed) 처리
                if (item.parentElement.id === 'suitcase-zone') {
                    checklistElement.classList.add('packed');
                } else {
                    checklistElement.classList.remove('packed');
                }
            });
        }


        /* =========================================
           4. 다시 짐싸기(리셋) 버튼
           ========================================= */
        document.getElementById('reset-btn').addEventListener('click', () => {
            // 캐리어 안에 있는 모든 아이템을 다시 바깥으로 이동
            items.forEach(item => {
                outsideZone.appendChild(item);
            });
            updateAppStatus(); // 상태 초기화
        });
    </script>
</body>
</html>
